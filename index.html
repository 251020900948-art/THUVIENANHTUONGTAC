<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <h1>Interactive Photo Gallery</h1>

    <div id="featured">
        <p id="featured-text">Hover over or focus on a thumbnail below to preview it here.</p>
    </div>

    <div id="thumbnails">
        <img src="https://picsum.photos/id/10/300/200" alt="A lush green forest with a winding river cutting through the valley">
        <img src="https://picsum.photos/id/29/300/200" alt="A dramatic mountain peak towering above the clouds at sunrise">
        <img src="https://picsum.photos/id/49/300/200" alt="A vibrant sunset over a calm ocean with orange and purple reflections">
        <img src="https://picsum.photos/id/65/300/200" alt="A cozy wooden cabin nestled among tall pine trees in winter">
        <img src="https://picsum.photos/id/84/300/200" alt="A peaceful lavender field stretching toward rolling hills in Provence">
        <img src="https://picsum.photos/id/119/300/200" alt="A rustic stone bridge arching over a crystal-clear mountain stream">
    </div>

    <script src="gallery.js"></script>
</body>
</html>
